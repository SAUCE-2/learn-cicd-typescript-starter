name: Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

  steps:
    - name: Check out code
      uses: actions/checkout@v6

    - uses: pnpm/setup@v1
      with:
        version: 12
        runtime: node@24
        cache: true

    - name: Install dependencies
      run: pnpm ci

    - name: Build
      run: pnpm run build
