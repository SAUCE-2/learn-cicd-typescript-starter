name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: Run vitest
        run: pnpm run test -- --coverage

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: Check formatting
        run: pnpm run format:check
